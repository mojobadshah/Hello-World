name: Groq Refactor Check

on:
  push:
    branches:
      - 'groq-poly-refactor-hello-world-2026-04-26t02-45-23-652z'
  workflow_dispatch:

jobs:
  refactor_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show model
        run: echo "Model llama-3.1-8b-instant"
      - name: Show refactor metadata
        run: |
          test -f .groq-bubble/refactor-plan.md && cat .groq-bubble/refactor-plan.md || true
          test -f .groq-bubble/refactor-result.json && cat .groq-bubble/refactor-result.json || true
      - name: Show safe proposed changes
        run: |
          find groq-bubble-safe-changes -maxdepth 2 -type f -print 2>/dev/null || true
      - name: Smoke check
        run: |
          echo "Safe review branch created."
          find . -maxdepth 3 -type f | head -n 120

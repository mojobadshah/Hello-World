name: Refactor GitHub Repository
on:
  push:
    branches: [ main ]
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Safely apply refactored changes
        uses: ./.github/actions/saferefactory